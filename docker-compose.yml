services:
  market-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-sentinel:1.0.0
    container_name: market-sentinel
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${BIND_HOST:-127.0.0.1}:8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /app/data
      TZ: Asia/Shanghai
      # Optional first-run bootstrap. Settings can be changed in the UI afterwards.
      PROXY_URL: "${PROXY_URL:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
